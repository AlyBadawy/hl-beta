# Example secrets configuration
# Copy this to config/secrets.yaml and fill in your actual values
# config/secrets.yaml is in .gitignore and should never be committed

server:
  ip: 172.20.20.3
  ssh_user: homelab

nas:
  ip: 172.20.20.2
  base_share: /var/nfs/shared
  base_mount: /mnt/nas

smtp:
  server: smtp.resend.com
  port: "587"
  username: your-smtp-username
  password: your-smtp-password
  from: noreply@example.com

email:
  admin: admin@example.com

domain:
  base: in.alybadawy.com

git:
  repo: https://github.com/YOUR_USERNAME/YOUR_REPO
