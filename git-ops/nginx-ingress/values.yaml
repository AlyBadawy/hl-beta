# Nginx Ingress Controller Helm Chart Values

## Controller Configuration
controller:
  # Replica count
  replicas: 1

  # Service configuration
  service:
    type: LoadBalancer
    # Fallback to NodePort if LoadBalancer not available
    externalTrafficPolicy: Local
    annotations: {}
    ports:
      http: 80
      https: 443

  # Ingress class
  ingressClass: nginx
  ingressClassResource:
    enabled: true
    default: true

  # Node selector (run on all nodes)
  nodeSelector: {}

  # Tolerations (if using taints)
  tolerations: []

  # Affinity rules
  affinity: {}

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 90Mi

  # Pod security policy
  podSecurityPolicy:
    enabled: false

  # Network policies
  networkPolicy:
    enabled: false

## Default Backend Configuration
defaultBackend:
  enabled: true
  name: default-backend
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 90Mi
    requests:
      cpu: 10m
      memory: 20Mi

## Global Configuration
global:
  imagePullSecrets: []

## RBAC Configuration
rbac:
  create: true

## Service Account Configuration
serviceAccount:
  create: true
  name: nginx-ingress

## Pod Disruption Budget (optional)
podDisruptionBudget:
  enabled: false

## Metrics (disabled for now)
metrics:
  enabled: false
  service:
    type: ClusterIP
    port: 10254

## TCP and UDP services (for future use)
tcp: {}
udp: {}
