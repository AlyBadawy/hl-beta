{{- if .Values.longhorn.helm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.longhorn.helm.name }}"
  namespace: "{{ .Values.argocd.namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .Values.longhorn.helm.name }}"
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
    homelab/stack: infrastructure
  annotations:
    # Sync wave 3: after ArgoCD (wave 2)
    # Must complete before infra-longhorn-config (wave 4) to ensure CRDs exist
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  # Multi-source: Helm chart from Longhorn registry + values from this git repo
  # This ensures git-ops/infrastructure/longhorn/helm-values.yaml is the single source of truth
  sources:
    - repoURL: https://charts.longhorn.io
      chart: "{{ .Values.longhorn.helm.chart }}"
      targetRevision: "{{ .Values.longhorn.helm.chartVersion }}"
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/{{ .Values.longhorn.helm.valuesPath }}
        # Backup target is constructed from cluster-config values
        # NFSv3 with nolock (stateless locking) for NAS compatibility
        parameters:
          - name: defaultSettings.backupTarget
            value: "nfs://${NAS_IP}:${NAS_BASE_SHARE}/backups/k3s-longhorn?nfsOptions=nfsvers%3D3%2Cnolock"

    - repoURL: "{{ .Values.git.repoUrl }}"
      targetRevision: "{{ .Values.git.targetRevision }}"
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.longhorn.namespace }}"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Longhorn self-modifies resources at runtime after each sync
  # (e.g., default settings ConfigMap). Ignoring them prevents OutOfSync loops
  ignoreDifferences:
    # Longhorn rewrites its own default settings ConfigMap at startup
    - group: ""
      kind: ConfigMap
      name: longhorn-default-setting
      namespace: "{{ .Values.longhorn.namespace }}"
      jsonPointers:
        - /data
    # CRD status is managed by Longhorn; preserveUnknownFields handling
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
{{- end }}
