{{- if .Values.argocd.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.name }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.argocd.name }}
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: {{ .Values.argocd.chart }}
    targetRevision: {{ .Values.argocd.chartVersion }}
    helm:
      valuesObject:
        configs:
          cm:
            # Server configuration
            server.disable.auth: "false"
            server.insecure: "true"  # No SSL yet

          # RBAC configuration
          rbac:
            policy.default: "role:readonly"

        # ArgoCD Server
        server:
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: "nginx"
            hosts:
              - "argo.{{ .Values.domain }}"
            paths:
              - /
            pathType: Prefix
            # No TLS for now
            tls: []

        # Storage: Local ephemeral (no PVC yet)
        persistence:
          enabled: false

        # Controller
        controller:
          replicas: 1

        # Repo server
        repoServer:
          replicas: 1

        # Application Controller
        applicationController:
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace }}

  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.automated.prune }}
      selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
