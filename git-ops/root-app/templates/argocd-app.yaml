# {{- if .Values.argocd.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: { { .Values.argocd.name } }
  namespace: { { .Values.argocd.namespace } }
  labels:
    app.kubernetes.io/name: { { .Values.argocd.name } }
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: { { .Values.argocd.chart } }
    targetRevision: { { .Values.argocd.chartVersion } }
    helm:
      values: |
        # Use defaults from ArgoCD chart, override only critical settings
        server:
          replicas: 1
          insecure: true
          ingress:
            enabled: false

        controller:
          replicas: 1

        repoServer:
          replicas: 1

        persistence:
          enabled: false

        redis:
          enabled: true

        configs:
          cm:
            server.disable.auth: "false"
            server.insecure: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: { { .Values.argocd.namespace } }

  syncPolicy:
    automated:
      prune: { { .Values.syncPolicy.automated.prune } }
      selfHeal: { { .Values.syncPolicy.automated.selfHeal } }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
# {{- end }}
