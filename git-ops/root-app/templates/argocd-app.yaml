# {{- if .Values.argocd.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.argocd.name }}"
  namespace: "{{ .Values.argocd.namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .Values.argocd.name }}"
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
  annotations:
    # Sync wave 2: after nginx-ingress (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  # Multi-source: Helm chart from upstream registry + values from this git repo.
  # The Ingress for ArgoCD is managed separately via argocd-ingress.yaml in this chart.
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: "{{ .Values.argocd.chart }}"
      targetRevision: "{{ .Values.argocd.chartVersion }}"
      helm:
        valueFiles:
          - $values/git-ops/argocd/values.yaml
        # Domain-specific values are injected here from root-app/values.yaml so
        # they never need to be hardcoded inside git-ops/argocd/values.yaml.
        # Parameters are applied after valueFiles and take precedence.
        parameters:
          - name: configs.cm.url
            value: "http://argo.{{ .Values.domain }}"
          - name: "configs.repositories[0].url"
            value: "{{ .Values.git.repoUrl }}"
          - name: "configs.repositories[0].type"
            value: git
          - name: "configs.repositories[0].name"
            value: hl-beta
    - repoURL: "{{ .Values.git.repoUrl }}"
      targetRevision: "{{ .Values.git.targetRevision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.argocd.namespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
# {{- end }}
