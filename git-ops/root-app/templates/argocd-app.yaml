{{- if .Values.argocd.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.argocd.name }}"
  namespace: "{{ .Values.argocd.namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .Values.argocd.name }}"
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  # Multi-source: Helm chart from upstream registry + values from this git repo.
  # The Ingress for ArgoCD is managed separately via argocd-ingress.yaml in this chart.
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: "{{ .Values.argocd.chart }}"
      targetRevision: "{{ .Values.argocd.chartVersion }}"
      helm:
        valueFiles:
          - $values/git-ops/argocd/values.yaml
    - repoURL: "{{ .Values.git.repoUrl }}"
      targetRevision: "{{ .Values.git.targetRevision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: "{{ .Values.argocd.namespace }}"
  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.automated.prune }}
      selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
