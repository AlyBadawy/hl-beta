{{- if .Values.nginxIngress.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.nginxIngress.name }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.nginxIngress.name }}
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  # Multi-source: Helm chart from upstream registry + values from this git repo.
  # This ensures git-ops/nginx-ingress/values.yaml is the single source of truth.
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: {{ .Values.nginxIngress.chart }}
      targetRevision: {{ .Values.nginxIngress.chartVersion }}
      helm:
        valueFiles:
          - $values/git-ops/nginx-ingress/values.yaml
    - repoURL: {{ .Values.git.repoUrl }}
      targetRevision: {{ .Values.git.targetRevision }}
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.nginxIngress.namespace }}

  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.automated.prune }}
      selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
