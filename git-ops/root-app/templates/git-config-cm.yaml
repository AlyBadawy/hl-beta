apiVersion: v1
kind: ConfigMap
metadata:
  name: git-config
  namespace: cluster-config
  labels:
    app.kubernetes.io/name: git-config
    app.kubernetes.io/instance: root-app
    app.kubernetes.io/component: configuration
data:
  # Cluster domain
  DOMAIN: {{ .Values.domain | quote }}

  # Git repository URL for all applications
  GIT_REPO_URL: {{ .Values.git.repoUrl | quote }}

  # Target branch
  GIT_TARGET_REVISION: {{ .Values.git.targetRevision | quote }}

  # Path to manifests
  GIT_PATH: {{ .Values.git.path | quote }}

  # ArgoCD specific
  ARGOCD_REPO_URL: {{ .Values.git.repoUrl | quote }}
  ARGOCD_NAMESPACE: {{ .Values.argocd.namespace | quote }}
  ARGOCD_INGRESS_HOST: "argo.{{ .Values.domain }}"

  # Nginx Ingress specific
  NGINX_INGRESS_NAMESPACE: {{ .Values.nginxIngress.namespace | quote }}
