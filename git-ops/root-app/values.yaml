# Root App - App of Apps Values
#
# Instance-specific values (domain, git.repoUrl) are NOT hardcoded here.
# They are injected as helm.parameters by provision/scripts/bootstrap-gitops,
# reading from config/secrets.yaml (which is git-ignored).
# Keeping them out of this file means the repo is portable across different
# homelabs without any git-ops edits.

# Cluster domain — injected by bootstrap via helm.parameters.
domain: ""

# Git repository configuration
git:
  # repoUrl — injected by bootstrap via helm.parameters.
  repoUrl: ""
  targetRevision: "main"
  path: "git-ops"

# ArgoCD Application Configuration
argocd:
  enabled: true
  namespace: "argocd"
  name: "argocd"
  chart: "argo-cd"
  chartVersion: "7.6.0"  # Latest stable as of 2026-05
  # Path to ArgoCD values in this repo
  valuesPath: "git-ops/argocd/values.yaml"

# Nginx Ingress Configuration
nginxIngress:
  enabled: true
  namespace: "ingress-nginx"
  name: "nginx-ingress"
  chart: "ingress-nginx"
  chartVersion: "4.11.0"  # Latest stable as of 2026-05
  # Path to Nginx values in this repo
  valuesPath: "git-ops/nginx-ingress/values.yaml"

# Sync policies
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
