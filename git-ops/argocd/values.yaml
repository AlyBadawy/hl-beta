# ArgoCD Helm Chart Values
# Managed by ArgoCD via root-app (argocd-app.yaml Application).
# The ArgoCD Ingress is NOT managed here — it lives in root-app/templates/argocd-ingress.yaml
# so it can be rendered with the domain from root-app/values.yaml.

## ArgoCD Server
server:
  replicas: 1

  # Run in insecure mode: ArgoCD serves HTTP, TLS terminated at nginx ingress.
  insecure: true

  # Ingress disabled here — managed as a plain manifest in root-app/templates/argocd-ingress.yaml.
  ingress:
    enabled: false

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

## ArgoCD Configs
configs:
  cm:
    # External URL used by ArgoCD for links in notifications and UI.
    url: "http://argo.in.alybadawy.com"
    server.disable.auth: "false"
    server.insecure: "true"
    application.instanceLabelKey: "argocd.argoproj.io/instance"

  rbac:
    policy.default: 'role:readonly'

  repositories:
    - url: https://github.com/AlyBadawy/hl-beta
      type: git
      name: hl-beta

## Persistence (disabled until Longhorn is available)
persistence:
  enabled: false

## Redis (in-memory session store)
redis:
  enabled: true

## Replica counts
controller:
  replicas: 1

repoServer:
  replicas: 1

applicationController:
  replicas: 1

## Resource limits (minimal for homelab)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

## Notifications (disabled for now)
notifications:
  enabled: false

## Metrics (disabled for now)
metrics:
  enabled: false
