apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Longhorn infrastructure configuration
# Managed by ArgoCD Application: infra-longhorn-config (wave 2)
#
# This kustomization:
# 1. Creates longhorn-system namespace
# 2. Manages ingress for Longhorn UI (replaces Helm ingress)
# 3. Manages recurring backup/snapshot jobs (wave 2, after Helm chart CRDs are installed)
# 4. Uses kustomize-envsubst plugin for variable substitution
#    - ${DOMAIN} substituted with cluster-config value
#
# Note: The Helm chart itself (Longhorn) is managed by infra-longhorn Application (wave 1)

namespace: longhorn-system

resources:
  - namespace.yaml
  - ingress.yaml
  - recurring-jobs.yaml

commonLabels:
  app.kubernetes.io/part-of: infrastructure
  app.kubernetes.io/managed-by: argocd

commonAnnotations:
  # This configuration depends on Longhorn CRDs being installed first
  # Enforced by sync-wave in ArgoCD Application
  longhorn.io/config-version: "1"

# Note: The domain in ingress.yaml is patched by the infra-longhorn-config
# Application using patchesJson6902. This approach avoids needing plugins
# and keeps everything self-contained within the ArgoCD Application definition.
