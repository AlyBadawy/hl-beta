apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-every-6h
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: recurring-jobs
spec:
  cron: "0 */6 * * *"
  task: snapshot
  groups:
    - default
  retain: 30
  concurrency: 2
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-every-6h
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: recurring-jobs
spec:
  # Offset by 30 min from snapshots so they don't race
  cron: "30 */6 * * *"
  task: backup
  groups:
    - default
  retain: 30
  concurrency: 1
  labels: {}
