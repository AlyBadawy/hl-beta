apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: ui
spec:
  ingressClassName: nginx
  rules:
    # Host is patched by infra-longhorn-config Application via patchesJson6902
    # The Application injects the domain from root-app values
    - host: longhorn.PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
