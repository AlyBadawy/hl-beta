# Helm values for the guerzon/vaultwarden chart.
# Docs: https://github.com/guerzon/vaultwarden/tree/main/charts/vaultwarden

# Full external URL of the instance (must match the ingress hostname, https).
domain: "https://vault.in.alybadawy.com"

# Admin token is managed via External Secrets Operator — never stored in git.
# Bootstrap: kubectl create secret generic vaultwarden-admin -n secrets \
#   --from-literal=ADMIN_TOKEN="$(openssl rand -base64 48)"
adminToken:
  existingSecret: vaultwarden-admin
  existingSecretKey: ADMIN_TOKEN

# Persistent storage on Longhorn — pre-created PVC managed by kustomization.yaml.
storage:
  existingVolumeClaim:
    claimName: vaultwarden-data-lh

# TLS-terminated ingress via nginx, certificate issued by cert-manager.
ingress:
  enabled: true
  class: "nginx"
  nginxIngressAnnotations: true
  additionalAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: true
  hostname: "vault.in.alybadawy.com"
  tlsSecret: "vaultwarden-tls" # cert-manager writes the issued cert here
