apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD itself, rendered from the upstream Helm chart via Kustomize's Helm
# inflation. This same directory is applied imperatively by scripts/bootstrap.sh
# AND tracked by apps/argocd.yaml, which is what makes ArgoCD self-managing:
# once the child Application syncs, it adopts these exact resources with no diff.

namespace: argocd

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 9.5.17 # verify latest stable before bootstrapping
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
