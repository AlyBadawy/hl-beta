# Helm values for the argo-cd chart.
# Docs: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

configs:
  cm:
    # CRITICAL: lets ArgoCD's repo-server build Kustomize overlays that use the
    # `helmCharts:` field (Helm inflation). Without this, every child app that
    # inflates a Helm chart fails to render. Keep this enabled.
    kustomize.buildOptions: --enable-helm
    accounts.admin: apiKey
  params:
    # nginx terminates TLS at the edge and talks plain HTTP to argocd-server.
    # This avoids the double-TLS / gRPC passthrough complications on k3s.
    server.insecure: true

# Web UI / API ingress. TLS is terminated by ingress-nginx using the shared
# wildcard cert (networking/wildcard-tls); no per-ingress cert needed.
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argo.in.alybadawy.com
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    tls: false
