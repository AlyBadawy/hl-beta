# Each remoteRef spells out conversionStrategy/decodingStrategy/
# metadataPolicy/nullBytePolicy explicitly, even though they're the API's
# own defaults — the external-secrets CRD fills them in server-side on
# whatever gets applied, and omitting them here leaves ArgoCD permanently
# OutOfSync comparing our unset fields against the live defaulted object.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-secrets
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres-secret
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-secret
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres-secret
        property: database
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
