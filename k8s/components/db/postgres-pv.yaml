apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-nas
  labels:
    app.kubernetes.io/name: postgres
    homelab/stack: db
spec:
  capacity:
    storage: 7Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
  nfs:
    server: 172.20.20.2
    path: /var/nfs/shared/storage/postgres-data
