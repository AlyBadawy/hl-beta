apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-ml
    homelab/stack: immich
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-ml
    spec:
      securityContext:
        supplementalGroups: [44, 993]
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:release-openvino
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: IMMICH_MACHINE_LEARNING_WORKERS
              value: "2"
            - name: TRANSFORMERS_BACKEND
              value: openvino
            - name: OPENVINO_DEVICE
              value: GPU
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-model-cache
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
