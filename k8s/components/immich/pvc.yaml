apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-ml
    homelab/stack: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    homelab/stack: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: immich-data-nas
  resources:
    requests:
      storage: 750Gi
