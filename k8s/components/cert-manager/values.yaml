# Helm values for the cert-manager chart.
# Docs: https://cert-manager.io/docs/installation/helm/

# Install the cert-manager CRDs as part of this release. The child Application
# uses ServerSideApply so the large CRDs apply cleanly.
crds:
  enabled: true
  keep: true

# Force cert-manager to use public recursive resolvers for DNS-01 propagation
# checks. CoreDNS (10.43.0.10) forwards to the node's upstream which may be
# a local Pi-hole/AdGuard that resolves *.in.alybadawy.com internally. Google
# and Cloudflare resolvers use proper EDNS and reach Cloudflare's public TXT
# records correctly.
extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
  - --dns01-recursive-nameservers-only
