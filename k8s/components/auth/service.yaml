apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: security
  labels:
    app.kubernetes.io/name: authentik
    homelab/stack: auth
spec:
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: https
      port: 9443
      targetPort: 9443
