apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: security
  labels:
    app.kubernetes.io/name: authentik
    homelab/stack: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-secrets
    kind: ClusterSecretStore
  target:
    name: authentik-secret
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik-secret
        property: secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__USER
      remoteRef:
        key: authentik-db
        property: username
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik-db
        property: password
    - secretKey: AUTHENTIK_EMAIL__HOST
      remoteRef:
        key: resend-smtp
        property: host
    - secretKey: AUTHENTIK_EMAIL__PORT
      remoteRef:
        key: resend-smtp
        property: port
    - secretKey: AUTHENTIK_EMAIL__FROM
      remoteRef:
        key: resend-smtp
        property: from_address
    - secretKey: AUTHENTIK_EMAIL__USE_TLS
      remoteRef:
        key: resend-smtp
        property: use_tls
    - secretKey: AUTHENTIK_EMAIL__USERNAME
      remoteRef:
        key: resend-smtp
        property: username
    - secretKey: AUTHENTIK_EMAIL__PASSWORD
      remoteRef:
        key: resend-smtp
        property: password
