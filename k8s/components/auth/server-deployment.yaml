apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: security
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
    homelab/stack: auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: authentik
          image: ghcr.io/goauthentik/server:2026.5.2
          args: ["server"]
          ports:
            - containerPort: 9000
            - containerPort: 9443
          envFrom:
            - configMapRef:
                name: authentik-config
            - secretRef:
                name: authentik-secret
          volumeMounts:
            - name: media
              mountPath: /data # Updated from /media to /data to match official image expectations
            - name: templates
              mountPath: /templates
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media-lh
        - name: templates
          persistentVolumeClaim:
            claimName: authentik-templates-lh
