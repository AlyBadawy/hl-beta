apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: security
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: worker
    homelab/stack: auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
      containers:
        - name: authentik
          image: ghcr.io/goauthentik/server:2026.2.2
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: authentik-config
            - secretRef:
                name: authentik-secret
          volumeMounts:
            - name: media
              mountPath: /data # Updated from /media to /data to match official image expectations
            - name: templates
              mountPath: /templates
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media-lh
        - name: templates
          persistentVolumeClaim:
            claimName: authentik-templates-lh
