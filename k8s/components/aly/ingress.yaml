apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aly
  namespace: websites
  labels:
    app.kubernetes.io/name: aly
    homelab/stack: aly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: aly.in.alybadawy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aly
                port:
                  number: 80
