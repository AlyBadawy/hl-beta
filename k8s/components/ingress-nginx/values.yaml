# Helm values for the ingress-nginx chart.
# Docs: https://github.com/kubernetes/ingress-nginx/tree/main/charts/ingress-nginx

controller:
  # Make nginx the cluster-wide default IngressClass so Ingress resources
  # without an explicit class are handled by it.
  ingressClassResource:
    default: true

  # On k3s, a Service of type LoadBalancer is fulfilled by the built-in
  # ServiceLB (klipper-lb), which exposes the controller on the node IP(s).
  # Ensure k3s was installed WITH Traefik disabled (see README) so nginx is the
  # only ingress controller binding :80/:443.
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local

  # Surface real client IPs through ServiceLB.
  config:
    use-forwarded-headers: "true"
    # TLS hardening
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    # Security headers
    add-headers: "ingress-nginx/security-headers"
    # Limits and timeouts
    proxy-read-timeout: "60"
    proxy-send-timeout: "60"
    client-max-body-size: "100m"
