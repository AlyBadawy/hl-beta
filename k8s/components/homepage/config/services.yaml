- Services:
    - Nextcloud:
        href: "https://cloud.in.alybadawy.com"
        description: File sharing and collaboration
        icon: nextcloud.svg
        widget:
          type: nextcloud
          url: https://nextcloud.cloud.svc.cluster.local
          username: "{{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
          password: "{{HOMEPAGE_VAR_NEXTCLOUD_PASSWORD}}"
    - Immich:
        href: "https://photos.in.alybadawy.com"
        description: Photo management
        icon: immich.svg
        widget:
          type: immich
          url: http://immich-server.immich.svc.cluster.local:2283
          key: "{{HOMEPAGE_VAR_IMMICH_TOKEN}}"
          version: 2 # optional, default is 1

- Database:
    - pgAdmin:
        href: "https://pgadmin.in.alybadawy.com"
        description: Database management
        icon: pgadmin.svg

- Infrastructure:
    - ArgoCD:
        href: "https://argo.in.alybadawy.com"
        description: GitOps deployments
        icon: argo-cd.svg
        widget:
          type: argocd
          url: "https://argo.in.alybadawy.com"
          key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
    - Vault:
        href: "https://secrets.in.alybadawy.com"
        description: Secrets management
        icon: vault.svg
    - Longhorn:
        href: "https://longhorn.in.alybadawy.com"
        description: Distributed storage
        icon: longhorn.svg
    - Authentik:
        href: "https://auth.in.alybadawy.com"
        description: Identity provider
        icon: authentik.svg
        widget:
          type: authentik
          url: http://authentik.auth.svc.cluster.local:9000
          key: { { HOMEPAGE_VAR_AUTHENTIK_TOKEN } }
          version: 2 # optional, default is 1

- Monitoring:
    - Grafana:
        href: "https://grafana.in.alybadawy.com"
        description: Metrics dashboards
        icon: grafana.svg
        widget:
          type: grafana
          url: "https://grafana.in.alybadawy.com"
          username: admin
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
    - Prometheus:
        href: "https://prometheus.in.alybadawy.com"
        description: Metrics collection
        icon: prometheus.svg
        widget:
          type: prometheus
          url: "http://prometheus-operated.monitor.svc.cluster.local:9090"
    - Alertmanager:
        href: "https://alerts.in.alybadawy.com"
        description: Alert routing
        icon: alertmanager.svg

- Network:
    - My IP:
        href: "https://ip.in.alybadawy.com"
        description: Click to see your real IP
        icon: mdi-vpn
    - External IP:
        description: Current WAN IP
        icon: mdi-wan
        widget:
          type: customapi
          url: "https://api.ipify.org?format=json"
          mappings:
            - field: ip
              label: WAN IP
