- Services:
    - Nextcloud:
        href: "https://cloud.in.alybadawy.com"
        description: File sharing and collaboration
        icon: nextcloud.svg
        namespace: cloud
        pod-selector: app.kubernetes.io/name=nextcloud
        ping: cloud.in.alybadawy.com
        widget:
          type: nextcloud
          url: https://cloud.in.alybadawy.com
          username: "{{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
          password: "{{HOMEPAGE_VAR_NEXTCLOUD_PASSWORD}}"
    - Immich:
        href: "https://photos.in.alybadawy.com"
        description: Photo management
        icon: immich.svg
        namespace: immich
        pod-selector: app.kubernetes.io/name=immich-server
        ping: photos.in.alybadawy.com
        widget:
          type: immich
          url: http://immich-server.immich.svc.cluster.local:2283
          key: "{{HOMEPAGE_VAR_IMMICH_TOKEN}}"
          version: 2 # optional, default is 1

- Database:
    - pgAdmin:
        href: "https://pgadmin.in.alybadawy.com"
        description: Database management
        icon: pgadmin.svg
        namespace: db
        pod-selector: app.kubernetes.io/name=pgadmin
        ping: pgadmin.in.alybadawy.com

- Infrastructure:
    - ArgoCD:
        href: "https://argo.in.alybadawy.com"
        description: GitOps deployments
        icon: argo-cd.svg
        namespace: argocd
        pod-selector: app.kubernetes.io/name=argocd-server
        ping: argo.in.alybadawy.com
        widget:
          type: argocd
          url: "https://argo.in.alybadawy.com"
          key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
    - Authentik:
        href: "https://auth.in.alybadawy.com"
        description: Identity provider
        icon: authentik.svg
        namespace: auth
        pod-selector: "app.kubernetes.io/name=authentik,app.kubernetes.io/component=server"
        ping: auth.in.alybadawy.com
        widget:
          type: authentik
          url: "https://auth.in.alybadawy.com"
          key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
          version: 2 # optional, default is 1
    - Vault:
        href: "https://secrets.in.alybadawy.com"
        description: Secrets management
        icon: vault.svg
        namespace: security
        pod-selector: "app.kubernetes.io/name=vault,component=server"
        ping: secrets.in.alybadawy.com
    - Longhorn:
        href: "https://longhorn.in.alybadawy.com"
        description: Distributed storage
        icon: longhorn.svg
        namespace: longhorn-system
        pod-selector: app=longhorn-ui
        ping: longhorn.in.alybadawy.com

- Monitoring:
    - Grafana:
        href: "https://grafana.in.alybadawy.com"
        description: Metrics dashboards
        icon: grafana.svg
        namespace: monitor
        pod-selector: app.kubernetes.io/name=grafana
        ping: grafana.in.alybadawy.com
        widget:
          type: grafana
          url: "https://grafana.in.alybadawy.com"
          username: admin
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
    - Prometheus:
        href: "https://prometheus.in.alybadawy.com"
        description: Metrics collection
        icon: prometheus.svg
        namespace: monitor
        pod-selector: app.kubernetes.io/name=prometheus
        ping: prometheus.in.alybadawy.com
        widget:
          type: prometheus
          url: "http://prometheus-operated.monitor.svc.cluster.local:9090"
    - Alertmanager:
        href: "https://alerts.in.alybadawy.com"
        description: Alert routing
        icon: alertmanager.svg
        namespace: monitor
        pod-selector: app.kubernetes.io/name=alertmanager
        ping: alerts.in.alybadawy.com

- Network:
    - My IP:
        href: "https://ip.in.alybadawy.com"
        description: Click to see your real IP
        icon: mdi-vpn
        namespace: websites
        pod-selector: app=ip
        ping: ip.in.alybadawy.com
    - External IP:
        description: Current WAN IP
        icon: mdi-wan
        ping: api.ipify.org
        widget:
          type: customapi
          url: "https://api.ipify.org?format=json"
          mappings:
            - field: ip
              label: WAN IP
