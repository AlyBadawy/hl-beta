title: SA Cloud - homelab
description: A homelab dashboard built with k3s and kubernetes components, designed to provide an overview of the various applications, databases, infrastructure, monitoring tools, and network components in the homelab environment.
allowedHosts: in.alybadawy.com

startUrl: https://in.alybadawy.com
base: https://in.alybadawy.com/

disableIndexing: true

language: en

theme: dark
color: slate

background:
  image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
  blur: sm # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
  saturate: 50 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
  brightness: 25 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 75 # 0-100

blockHighlights:
  levels:
    good: "bg-emerald-500/40 text-emerald-950 dark:bg-emerald-900/60 dark:text-emerald-400"
    warn: "bg-amber-300/30 text-amber-900 dark:bg-amber-900/30 dark:text-amber-200"
    danger: "bg-rose-700/45 text-rose-200 dark:bg-rose-950/70 dark:text-rose-400"

useEqualHeights: true
disableCollapse: true
target: _blank

headerStyle: boxedWidgets

layout:
  Services:
    style: row
    columns: 2
  Database:
    style: row
    columns: 2
  External Links:
    Social:
      style: column
    Developer:
      style: column
    Tools:
      style: column
    Resources:
      style: column
  Infrastructure:
    style: row
    columns: 2
  Monitoring:
    style: row
    columns: 3
  Network:
    style: row
    columns: 2
