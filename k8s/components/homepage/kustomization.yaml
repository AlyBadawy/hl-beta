apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: websites

configMapGenerator:
  - name: homepage-config
    files:
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/kubernetes.yaml
      - config/docker.yaml

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - external-secret.yaml
