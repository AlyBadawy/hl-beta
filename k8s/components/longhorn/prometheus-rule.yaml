apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: longhorn-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeUnhealthy
          expr: longhorn_volume_robustness != 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is not healthy"
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup failed for volume {{ $labels.volume }}"
        - alert: LonghornDiskPressure
          expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk usage above 85% on {{ $labels.node }}"
