apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Longhorn distributed storage, rendered from the upstream Helm chart via
# Kustomize's Helm inflation. This same directory is applied imperatively by
# provision/restore-volumes.sh AND tracked by k8s/apps/longhorn.yaml, which
# makes Longhorn self-managing: once the child Application syncs, it adopts
# these exact resources with no diff.

namespace: longhorn-system

resources:
  - backup-target.yaml
  - recurring-jobs.yaml
  - prometheus-rule.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.8.1 # verify latest stable before bootstrapping
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: values.yaml
    includeCRDs: true

# ArgoCD doesn't understand Helm lifecycle hooks — it treats the pre-upgrade
# Job as a regular resource and keeps reconciling it, causing a creation loop.
# Longhorn's manager handles version migration directly; this Job is only
# meaningful when Helm itself drives the upgrade, not ArgoCD.
patches:
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-pre-upgrade
        namespace: longhorn-system
