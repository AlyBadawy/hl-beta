apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Longhorn distributed storage, rendered from the upstream Helm chart via
# Kustomize's Helm inflation. This same directory is applied imperatively by
# provision/restore-volumes.sh AND tracked by k8s/apps/longhorn.yaml, which
# makes Longhorn self-managing: once the child Application syncs, it adopts
# these exact resources with no diff.

namespace: longhorn-system

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.8.1 # verify latest stable before bootstrapping
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: values.yaml
    includeCRDs: true

# The pre-upgrade Job has a helm.sh/hook annotation that ArgoCD ignores — it
# applies the Job alongside all other resources. Pushing it to wave 1 ensures
# the ServiceAccount and RBAC from wave 0 exist before the Job's pod runs.
patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-pre-upgrade
        namespace: longhorn-system
        annotations:
          argocd.argoproj.io/sync-wave: "1"
