apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: security
  labels:
    app.kubernetes.io/name: vault
    homelab/stack: security
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: unseal
              image: hashicorp/vault:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                    "${VAULT_ADDR}/v1/sys/health" 2>/dev/null)
                  if [ "$HTTP" = "503" ]; then
                    echo "Vault is sealed — unsealing"
                    vault operator unseal "$UNSEAL_KEY"
                  elif [ "$HTTP" = "200" ] || [ "$HTTP" = "429" ] || [ "$HTTP" = "473" ]; then
                    echo "Vault is unsealed (HTTP $HTTP) — nothing to do"
                  else
                    echo "Vault unreachable or not ready (HTTP $HTTP) — will retry next minute"
                    exit 1
                  fi
              env:
                - name: VAULT_ADDR
                  value: http://vault-0.vault-internal.security.svc.cluster.local:8200
                - name: UNSEAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-key
                      key: key
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
