apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: security
  labels:
    app.kubernetes.io/name: vault
    homelab/stack: security
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: unseal
              image: hashicorp/vault:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  VAULT_HOST=$(echo "$VAULT_ADDR" | sed 's|http://||' | cut -d: -f1)
                  VAULT_PORT=$(echo "$VAULT_ADDR" | sed 's|http://||' | cut -d: -f2)
                  if ! nc -z -w 5 "$VAULT_HOST" "$VAULT_PORT" 2>/dev/null; then
                    echo "Vault port not reachable — will retry next minute"
                    exit 1
                  fi
                  vault status 2>/dev/null; STATUS=$?
                  if [ "$STATUS" -eq 2 ]; then
                    echo "Vault is sealed — unsealing"
                    vault operator unseal "$UNSEAL_KEY"
                  else
                    echo "Vault is unsealed — nothing to do"
                  fi
              env:
                - name: VAULT_ADDR
                  value: http://vault-0.vault-internal.security.svc.cluster.local:8200
                - name: UNSEAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-key
                      key: key
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
