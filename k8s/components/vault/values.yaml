# Helm values for the hashicorp/vault chart.
# Docs: https://developer.hashicorp.com/vault/docs/platform/k8s/helm/configuration

server:
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

  # PVC is managed separately in pvc.yaml (vault-data) so we can apply
  # Longhorn labels and recurring-backup annotations consistently.
  dataStorage:
    enabled: false

  # Mount the Longhorn-backed PVC at the storage path expected by the config above.
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: vault-data

  volumeMounts:
    - name: data
      mountPath: /vault/data

  # Go's runtime sends SIGURG to itself for goroutine preemption (since Go 1.14).
  # Newer kernels enforce AppArmor on intra-process signals, causing the default
  # containerd profile to deny SIGURG and break Vault. Unconfined scopes the
  # exemption to this container only.
  statefulSet:
    securityContext:
      container:
        appArmorProfile:
          type: Unconfined

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 128Mi

  # Ingress is managed via ingress.yaml to stay consistent with the rest of
  # the cluster (standalone nginx Ingress resource + cert-manager annotation).
  ingress:
    enabled: false

ui:
  enabled: true

# The sidecar injector is not needed — ESO handles all secret distribution.
injector:
  enabled: false
