apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: security
  labels:
    app.kubernetes.io/name: vault
    homelab/stack: security
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: vault-data-nas
  resources:
    requests:
      storage: 5Gi
