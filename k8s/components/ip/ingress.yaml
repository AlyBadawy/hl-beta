apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ip
  namespace: websites
  labels:
    app.kubernetes.io/name: ip
    homelab/stack: ip
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: ip.in.alybadawy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ip
                port:
                  number: 80
