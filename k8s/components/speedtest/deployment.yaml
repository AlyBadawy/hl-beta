apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  namespace: speedtest
  labels:
    app.kubernetes.io/name: speedtest-tracker
    homelab/stack: speedtest
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speedtest-tracker
  template:
    metadata:
      labels:
        app: speedtest-tracker
    spec:
      containers:
        - name: speedtest-tracker
          image: lscr.io/linuxserver/speedtest-tracker:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: speedtest-secret
                  key: app-key
            - name: DB_CONNECTION
              value: sqlite
            - name: APP_URL
              value: "https://speedtest.in.alybadawy.com"
            - name: SPEEDTEST_SCHEDULE
              value: "0 */6 * * *"
          volumeMounts:
            - name: data
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: speedtest-data
