# Self-management Application for the root "app of apps" itself.
#
# bootstrap.sh applies root/root-app.yaml imperatively to kick everything off,
# but nothing tracks that Application — so changes to it would never reach the
# cluster. This child app tracks root/ and adopts the running root Application
# with no diff (same self-adoption trick as apps/argocd.yaml). From here on the
# root app manages ITSELF: edit root/root-app.yaml and `git push`.
#
# Note: this Application is named "root-self" (not "root") on purpose — its
# managed resource is the "root" Application object, and the two must be
# distinct objects in the argocd namespace. The result is a small cycle: the
# root app creates root-self (from apps/), and root-self manages root (from
# root/). Both render identically to what is running, so they converge cleanly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-self
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AlyBadawy/hl-beta
    targetRevision: main
    path: root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
